name: deploy

# Why this workflow exists:
# The site is plain HTML/CSS/JS — no framework, no bundler, no build step —
# but it still needs a workflow because version.json (the v{Y}.{M}.{N} tag
# shown in the welcome panel) is generated from `git rev-list` at deploy
# time and is gitignored, never in the repo. GitHub Pages "deploy from
# branch" can't run that step, so Pages source is set to "GitHub Actions"
# (Settings → Pages) and this workflow uploads the repo + the freshly
# computed version.json as the Pages artifact on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version.json
        run: |
          MONTH_START=$(date -u +%Y-%m-01)
          COUNT=$(git rev-list --count --since="$MONTH_START" HEAD)
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          MAJOR=$((YEAR - 2026))
          VER="v${MAJOR}.${MONTH}.${COUNT}"
          SHA=$(git rev-parse --short HEAD)
          DATE=$(git log -1 --format=%cI)
          printf '{"ver":"%s","sha":"%s","date":"%s"}\n' "$VER" "$SHA" "$DATE" > version.json
          cat version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
