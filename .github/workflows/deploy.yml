name: deploy

# Site is served from Cloudflare Pages. This workflow deploys to Pages via
# wrangler on every push to main.
#
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN — token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — 88a6bc28031fa2fa2b929534b5f39fa7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=personal-website --branch=main --commit-dirty=true
