name: deploy

# Site is served from Cloudflare Pages. This workflow regenerates the
# git-derived version.json on every push to main and deploys to Pages via
# wrangler. version.json is gitignored — it must be produced at deploy
# time so the welcome panel shows the current commit.
#
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN — token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — 88a6bc28031fa2fa2b929534b5f39fa7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate version.json
        run: |
          MONTH_START=$(date -u +%Y-%m-01)
          COUNT=$(git rev-list --count --since="$MONTH_START" HEAD)
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          MAJOR=$((YEAR - 2026))
          VER="v${MAJOR}.${MONTH}.${COUNT}"
          SHA=$(git rev-parse --short HEAD)
          DATE=$(git log -1 --format=%cI)
          printf '{"ver":"%s","sha":"%s","date":"%s"}\n' "$VER" "$SHA" "$DATE" > version.json
          cat version.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=personal-website --branch=main --commit-dirty=true
