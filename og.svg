<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Menlo', monospace; }
      .fg { fill: #e5e2dd; }
      .orange { fill: #d97757; }
      .dim { fill: #7a7670; }
      .yellow { fill: #c9a96e; }
      .violet { fill: #b08ad6; }
      .cyan { fill: #6fb1bc; }
      .pink { fill: #d36a8c; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#1a1a1a"/>

  <!-- Topline -->
  <text x="60" y="50" class="mono" font-size="16">
    <tspan class="violet">personal-website</tspan> <tspan class="cyan">main</tspan><tspan class="pink">*</tspan>
  </text>
  <text x="60" y="80" class="mono" font-size="16">
    <tspan class="orange">›</tspan> <tspan class="yellow">charlie</tspan>
  </text>

  <!-- Welcome box border -->
  <rect x="60" y="110" width="1080" height="430" rx="10" fill="none" stroke="#d97757" stroke-width="1.5"/>
  <!-- Title cut-out -->
  <rect x="100" y="102" width="240" height="16" fill="#1a1a1a"/>
  <text x="115" y="115" class="mono orange" font-size="14" font-weight="600">─ charlie.xue v0.1.0 ─</text>

  <!-- Left column -->
  <text x="280" y="170" class="mono fg" font-size="22" font-weight="600" text-anchor="middle">Welcome to my site!</text>

  <!-- Mascot -->
  <g transform="translate(196, 200)" stroke="#d97757" stroke-width="3" fill="none">
    <rect x="6" y="6" width="160" height="100" rx="2"/>
    <circle cx="56" cy="50" r="9" fill="#d97757" stroke="none"/>
    <circle cx="116" cy="50" r="9" fill="#d97757" stroke="none"/>
    <polygon points="76,72 96,72 86,84" fill="#d97757" stroke="none"/>
  </g>

  <text x="280" y="370" class="mono fg" font-size="18" text-anchor="middle">cs &amp; statistics @ cornell</text>
  <text x="280" y="398" class="mono dim" font-size="15" text-anchor="middle">building ai-powered systems</text>
  <text x="280" y="422" class="mono dim" font-size="15" text-anchor="middle">~/personal-website</text>

  <!-- Divider -->
  <line x1="560" y1="150" x2="560" y2="500" stroke="#d97757" stroke-width="1" opacity="0.5"/>

  <!-- Right column -->
  <text x="600" y="170" class="mono orange" font-size="18" font-weight="600">Tips for getting started</text>
  <text x="600" y="210" class="mono fg" font-size="16">
    Type <tspan class="yellow">/help</tspan> to see all commands.
  </text>
  <text x="600" y="238" class="mono fg" font-size="16">
    Try <tspan class="yellow">/projects</tspan> to see what I've built.
  </text>

  <line x1="600" y1="270" x2="1100" y2="270" stroke="#d97757" stroke-width="1" opacity="0.4"/>

  <text x="600" y="310" class="mono orange" font-size="18" font-weight="600">What's new</text>
  <text x="600" y="350" class="mono fg" font-size="16">Redesigned site as an interactive terminal</text>
  <text x="600" y="378" class="mono fg" font-size="16">
    Shipped <tspan class="yellow">/podium</tspan> — ML-powered speech practice
  </text>
  <text x="600" y="406" class="mono fg" font-size="16">
    Shipped <tspan class="yellow">/philly-vibe-map</tspan> — 1.1M reviews
  </text>

  <!-- Footer hint -->
  <text x="60" y="595" class="mono" font-size="14">
    <tspan class="orange">↑</tspan> <tspan class="yellow">/help</tspan>
    <tspan class="dim">│</tspan>
    <tspan class="cyan">@cx18121</tspan>
    <tspan class="dim">│</tspan>
    <tspan class="violet">personal-website</tspan>
  </text>
  <text x="1140" y="595" class="mono dim" font-size="14" text-anchor="end">charliexue.com</text>
</svg>
